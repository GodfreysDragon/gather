name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHPUnit + contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - name: Find Composer's cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('api/composer.lock') }}
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pint --test
      # The tests validate every REST call against ../openapi.yaml.
      - run: php artisan test
      - name: Committed GraphQL schema matches the API
        run: |
          composer schema:graphql
          git diff --exit-code ../schema.graphql

  web:
    name: Web (lint, types, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check
      - run: npx vitest run
      - run: npm run build-only
      - name: Generated API types match openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Generated GraphQL types match schema.graphql
        run: |
          npm run gen:graphql
          git diff --exit-code src/api/graphql.generated.ts

  e2e:
    name: End-to-end (both transports)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the API on a freshly seeded database
        working-directory: api
        run: |
          composer install --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan serve --port=8000 > ../api.log 2>&1 &
      - name: Build and serve the SPA
        working-directory: web
        env:
          VITE_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run build-only
          npx vite preview --port 5173 --strictPort > ../web.log 2>&1 &
          npx playwright-core install --with-deps chromium
          npx wait-on@9.5.1 -t 60000 http://localhost:8000/up http://localhost:5173
      - name: Run the smoke test
        working-directory: web
        env:
          E2E_URL: http://localhost:5173
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            web/e2e/screenshots/
            api.log
            web.log
