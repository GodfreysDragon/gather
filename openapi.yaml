openapi: 3.0.3
info:
  title: Gather REST API
  version: 1.0.0
  description: |
    REST API for Gather, an events platform. This document is the contract between
    the backend (`api/`) and its clients (`web/` and anyone else):

    - the backend's test suite validates every REST response it makes against this file;
    - the Vue SPA generates its TypeScript types from this file (`npm run gen:api`).

    **Authentication.** `POST /auth/register` sends a confirmation e-mail; its link leads to
    `POST /auth/email/verify/{id}/{hash}`, which confirms the address and returns the first
    tokens. After that, `POST /auth/login` returns tokens. Send the access token as
    `Authorization: Bearer <token>`; it lasts an hour, and `POST /auth/refresh` exchanges the
    single-use refresh token for a new pair. Read endpoints are public; a token only
    personalises them (`viewer.is_registered`, drafts you organize).

    No endpoint reveals whether an e-mail address has an account.

    **Errors.** Every error is an RFC 9457 problem document (`application/problem+json`).
    Business-rule violations have a stable `type` URI ending in a code such as `event-full`.

    **Caching.** Successful `GET` responses carry a weak `ETag`; send it back in
    `If-None-Match` to get `304 Not Modified`.

    **Rate limits.** 120 requests/minute per user (or IP); 10/minute for the auth endpoints.
    Any operation can return `429` (with `Retry-After`) or `500`; both are problem documents too.

    **Dates.** Instants are ISO 8601 with an explicit offset on input (`2026-11-01T20:00:00+02:00`
    or `…Z`) and always UTC (`…Z`) on output.

    A GraphQL API over the same domain is served at `/graphql` (schema: `schema.graphql` at the repository root).
servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Events
  - name: Registrations
  - name: Venues
  - name: Me

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account (confirmed by e-mail)
      description: |
        Always answers `202` with the same message. A new address gets a confirmation link
        (valid for an hour); an address that already has an account gets an e-mail saying so
        instead, so the response never reveals which addresses are registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
      responses:
        '202':
          description: Check your inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100, description: 'Label for the tokens, e.g. "web" or "iPhone".' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '403':
          description: Right password, but the address isn't confirmed yet (`email-not-verified`). Ask for a new link with `POST /auth/email/resend`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: |
        Refresh tokens are single use: each call returns a new pair and retires the old one
        (and its access token). Presenting an already-used refresh token revokes every token
        from that login, since it means the token was copied.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, maxLength: 255 }
      responses:
        '200':
          description: A new token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/email/verify/{id}/{hash}:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm an e-mail address and log in
      description: |
        The confirmation e-mail links to the SPA's `/verify-email` page with these parameters;
        the SPA posts them here. A tampered or expired link is a `403`; a link for an address
        that is already confirmed (or no longer matches) is a `410` (`verification-link-invalid`).
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: hash, in: path, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: integer } }
        - { name: signature, in: query, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Address confirmed; the account's first tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '403':
          description: The link expired or was altered (`verification-link-expired`); ask for a new one.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: The link was already used or no longer matches the account.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/email/resend:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new confirmation link
      description: Always answers `202`; an e-mail goes out only if the address has an unconfirmed account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Check your inbox
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out (revokes this login's access and refresh tokens)
      responses:
        '204': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The authenticated user
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /me/registrations:
    get:
      tags: [Me]
      operationId: listMyRegistrations
      summary: Upcoming events the authenticated user is registered for
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events
      description: |
        Published and cancelled events, plus drafts organized by the caller.
        Filters are combined with AND.

        **Pagination.** Page numbers by default. Pass `pagination=cursor` for cursor pagination
        instead, then follow `links.next` (or pass `meta.next_cursor` as `cursor`).

        **Change feed.** `updated_since` returns every event changed at or after that instant,
        oldest change first and always cursor-paginated, so sync clients can resume where they
        stopped. Deleted events appear as tombstones: the usual representation with `deleted_at`
        set. It can't be combined with `sort`. Registrations and cancellations count as changes,
        so seat counts stay current. An event its organizer moves back to draft simply stops
        appearing for everyone else (a tombstone would reveal the draft), so long-lived clients
        should re-sync from scratch now and then.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: q, in: query, description: Matches title or description., schema: { type: string, maxLength: 100 } }
        - { name: city, in: query, schema: { type: string } }
        - { name: from, in: query, description: Only events starting at or after this instant., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Only events starting at or before this instant., schema: { type: string, format: date-time } }
        - { name: venue_id, in: query, schema: { type: integer } }
        - { name: organizer_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EventStatus' } }
        - { name: has_spots, in: query, description: Only published events that still have free spots (drafts and cancelled events are excluded)., schema: { type: string, enum: ['true', 'false', '1', '0'] } }
        - name: sort
          in: query
          description: Sort key; prefix with `-` for descending.
          schema:
            type: string
            enum: [starts_at, -starts_at, title, -title, created_at, -created_at]
            default: starts_at
        - { name: updated_since, in: query, description: 'Change feed: events changed at or after this instant, deletions included.', schema: { type: string, format: date-time } }
        - { name: pagination, in: query, description: '`cursor` for cursor pagination. Implied by `cursor` and `updated_since`.', schema: { type: string, enum: [offset, cursor], default: offset } }
        - { name: cursor, in: query, description: Opaque cursor from `meta.next_cursor` or `meta.prev_cursor`., schema: { type: string, maxLength: 500 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, description: Defaults to 50 in the change feed., schema: { type: integer, minimum: 1, maximum: 50, default: 12 } }
      responses:
        '200':
          description: A page of events
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta:
                    oneOf:
                      - { $ref: '#/components/schemas/PaginationMeta' }
                      - { $ref: '#/components/schemas/CursorPaginationMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event (you become its organizer)
      description: |
        Safe to retry with an `Idempotency-Key` header: repeating a request with the same key
        and body within 24 hours returns the original response (marked `Idempotent-Replayed: true`)
        instead of creating another event. Reusing a key with a different body is a 422
        (`idempotency-key-reused`); a repeat while the first request is still running is a 409
        (`idempotency-in-progress`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Any unique string per logical request, e.g. a UUID. Scoped to the caller.
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the new event.
              schema: { type: string, format: uri }
            Idempotent-Replayed:
              description: '`true` when this is the stored response to an earlier request with the same Idempotency-Key.'
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{event}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Event' }
        '304': { $ref: '#/components/responses/NotModified' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event (organizer only)
      description: |
        Partial update. Omitted fields keep their current value. Set `status` to `cancelled` to cancel.
        An event people have registered for can't go back to `draft` (`409 event-has-registrations`).
        Someone else's draft is `404`, not `403`, so its existence isn't revealed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Event' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event (organizer only)
      description: Only events nobody has registered for can be deleted (`409 event-has-registrations` otherwise); cancel those instead.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{event}/attendees:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Registrations]
      operationId: listAttendees
      summary: List an event's registrations (organizer only)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: A page of registrations
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Registration' }
                  links: { $ref: '#/components/schemas/PaginationLinks' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /events/{event}/registration:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Registrations]
      operationId: registerForEvent
      summary: Register the caller for an event
      description: |
        Idempotent. Returns `201` when a registration is created and `200` when the
        caller was already registered, so retries are always safe.
      responses:
        '200':
          description: Already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationEnvelope' }
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`event-full` or `registration-closed`'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Registrations]
      operationId: cancelRegistration
      summary: Cancel the caller's registration
      description: Idempotent. Succeeds even if the caller was not registered.
      responses:
        '204': { description: Not registered (any more) }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: List venues
      security: [{}, { bearerAuth: [] }]
      parameters:
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200':
          description: All venues, ordered by city and name
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }
        '304': { $ref: '#/components/responses/NotModified' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Venues]
      operationId: createVenue
      summary: Create a venue (admins only)
      description: Venues are shared by every organizer, so only admins can add them (`403` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, city, capacity]
              properties:
                name: { type: string, maxLength: 120 }
                address: { type: string, maxLength: 255 }
                city: { type: string, maxLength: 100 }
                capacity: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Venue' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

  /venues/{venue}:
    parameters:
      - { name: venue, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Venues]
      operationId: getVenue
      summary: Get a venue
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: OK
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Venue' }
        '304': { $ref: '#/components/responses/NotModified' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum access token from `/auth/login`, `/auth/refresh` or `/auth/email/verify`.

  parameters:
    EventId:
      name: event
      in: path
      required: true
      schema: { type: integer }

  headers:
    ETag:
      description: Weak validator for conditional requests (`If-None-Match`).
      schema: { type: string }

  responses:
    NotModified:
      description: The representation matching `If-None-Match` is still current.
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but not allowed (e.g. not the organizer)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: A business rule prevents this change; see `type`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: The request body or query failed validation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    ServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit exceeded; see `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: '`about:blank` for plain HTTP errors, otherwise a URI ending in a stable error code (e.g. `/problems/event-full`).'
          example: http://localhost:8000/problems/event-full
        title: { type: string, example: Event is full }
        status: { type: integer, example: 409 }
        detail: { type: string, example: '"Vue.js Meetup" has no spots left.' }

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Messages per field.
              additionalProperties:
                type: array
                items: { type: string }
              example:
                ends_at: [The ends at field must be a date after starts at.]

    TokenResponse:
      type: object
      required: [token, token_type, expires_at, refresh_token, refresh_token_expires_at, user]
      properties:
        token: { type: string, example: 1|q8Cw0bH9pS..., description: 'The access token, sent as `Authorization: Bearer <token>`.' }
        token_type: { type: string, enum: [Bearer] }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the access token stops working (an hour after issue by default). Use the refresh token to get a new one.
        refresh_token:
          type: string
          description: Single use. Send it to `POST /auth/refresh` for a new pair; keep it as secret as a password.
        refresh_token_expires_at: { type: string, format: date-time, description: 30 days after issue by default. }
        user: { $ref: '#/components/schemas/User' }

    Accepted:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Check your inbox: we've sent you an e-mail to confirm your address." }

    User:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        email:
          type: string
          format: email
          description: Only present for the authenticated user themself.

    Venue:
      type: object
      required: [id, name, address, city, capacity]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        capacity: { type: integer, minimum: 1 }

    EventStatus:
      type: string
      enum: [draft, published, cancelled]

    Event:
      type: object
      required: [id, title, description, starts_at, ends_at, status, capacity, registration_count, spots_left, viewer, venue, organizer, created_at, updated_at, deleted_at, links]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date-time, example: '2026-11-01T18:00:00Z' }
        ends_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        capacity: { type: integer, minimum: 1 }
        registration_count: { type: integer, minimum: 0 }
        spots_left: { type: integer, minimum: 0 }
        viewer:
          type: object
          description: Facts about the event relative to the caller (all false when anonymous).
          required: [is_registered, is_organizer]
          properties:
            is_registered: { type: boolean }
            is_organizer: { type: boolean }
        venue: { $ref: '#/components/schemas/Venue' }
        organizer: { $ref: '#/components/schemas/User' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set only on tombstones in the `updated_since` change feed.
        links:
          type: object
          required: [self, registration]
          properties:
            self: { type: string, format: uri }
            registration: { type: string, format: uri }

    EventInput:
      type: object
      required: [venue_id, title, description, starts_at, ends_at, capacity]
      properties:
        venue_id: { type: integer }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time, description: Must be in the future. }
        ends_at: { type: string, format: date-time, description: Must be after `starts_at`. }
        capacity: { type: integer, minimum: 1, description: May not exceed the venue's capacity. }
        status:
          type: string
          enum: [draft, published]
          description: Defaults to `published`.

    EventPatch:
      type: object
      minProperties: 1
      description: |
        Any non-empty subset of the event fields. `capacity` may not drop below the current registration
        count (`409 capacity-conflict`), and the event's capacity must still fit the venue after a `venue_id` change.
      properties:
        venue_id: { type: integer }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/EventStatus' }

    Registration:
      type: object
      required: [id, event_id, registered_at]
      properties:
        id: { type: integer }
        event_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        event: { $ref: '#/components/schemas/Event' }
        registered_at: { type: string, format: date-time }

    RegistrationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Registration' }

    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri, nullable: true }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }

    CursorPaginationMeta:
      type: object
      required: [path, per_page, next_cursor, prev_cursor]
      additionalProperties: false
      properties:
        path: { type: string }
        per_page: { type: integer }
        next_cursor: { type: string, nullable: true, description: 'Null on the last page.' }
        prev_cursor: { type: string, nullable: true }

    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total, from, to, path]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }
        path: { type: string }
        links:
          type: array
          description: Page links for rendering a pager.
          items:
            type: object
            properties:
              url: { type: string, nullable: true }
              label: { type: string }
              active: { type: boolean }
